<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Space Shooter — WebFliperama</title>
<style>
  :root{ --bg:#05070f; --panel:#0c1224; --accent:#00e5a0; --accent2:#ff3b6b; --text:#e8eefc; --muted:#7c8aa8; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;}
  h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 12px rgba(0,229,160,.5);}
  .hud{display:flex;gap:24px;font-size:14px;color:var(--muted);}
  .hud b{color:var(--text);}
  canvas{background:radial-gradient(ellipse at center, #0c1224 0%, #05070f 100%);border:2px solid #182240;border-radius:10px;}
  .tip{color:var(--muted);font-size:12px;}
  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;}
  .overlay.show{display:flex;}
  .overlay h2{color:var(--accent2);font-size:28px;margin:0;}
  button{background:var(--accent);color:#04140f;border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>SPACE SHOOTER</h1>
  <div class="hud"><span>Pontos: <b id="score">0</b></span><span>Vidas: <b id="lives">3</b></span></div>
  <canvas id="game" width="480" height="560"></canvas>
  <div class="tip">Setas / WASD para mover · Espaço para atirar</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Fim de jogo</h2>
  <div id="overlayScore"></div>
  <button id="restartBtn">Jogar novamente</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');

  let player, bullets, enemies, stars, score, lives, running, keys={}, spawnTimer, frame, raf;

  function reset(){
    player = { x: W/2-16, y: H-60, w:32, h:32, speed:5, cooldown:0 };
    bullets = []; enemies = []; score = 0; lives = 3; frame = 0; spawnTimer = 0;
    running = true;
    scoreEl.textContent = 0; livesEl.textContent = 3;
    stars = Array.from({length:60}, ()=>({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5}));
    overlay.classList.remove('show');
  }

  function endGame(){
    running = false;
    overlayTitle.textContent = 'Fim de jogo';
    overlayScore.textContent = 'Pontuação: ' + score;
    overlay.classList.add('show');
    // Hook de integração: postScore({ game: 'space-shooter', score });
  }

  window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; if (e.key===' ') e.preventDefault(); });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function spawnEnemy(){
    const x = Math.random()*(W-30);
    enemies.push({ x, y:-30, w:28, h:28, speed: 1.5 + Math.random()*1.5 + score/500 });
  }

  function update(){
    if (running){
      frame++;
      if (keys['arrowleft']||keys['a']) player.x -= player.speed;
      if (keys['arrowright']||keys['d']) player.x += player.speed;
      if (keys['arrowup']||keys['w']) player.y -= player.speed;
      if (keys['arrowdown']||keys['s']) player.y += player.speed;
      player.x = Math.max(0, Math.min(W-player.w, player.x));
      player.y = Math.max(0, Math.min(H-player.h, player.y));

      if (player.cooldown > 0) player.cooldown--;
      if (keys[' '] && player.cooldown<=0){
        bullets.push({x: player.x+player.w/2-2, y: player.y, w:4, h:12, speed:9});
        player.cooldown = 10;
      }

      bullets.forEach(b=> b.y -= b.speed);
      bullets = bullets.filter(b=> b.y > -20);

      spawnTimer--;
      if (spawnTimer <= 0){
        spawnEnemy();
        spawnTimer = Math.max(15, 45 - Math.floor(score/50));
      }

      enemies.forEach(en=> en.y += en.speed);

      // bullet-enemy collisions
      for (const en of enemies){
        for (const b of bullets){
          if (b.x < en.x+en.w && b.x+b.w > en.x && b.y < en.y+en.h && b.y+b.h > en.y){
            en.dead = true; b.dead = true;
            score += 10; scoreEl.textContent = score;
          }
        }
      }
      bullets = bullets.filter(b=>!b.dead);

      // enemy-player collision / offscreen
      for (const en of enemies){
        if (en.y > H){ en.dead = true; continue; }
        if (player.x < en.x+en.w && player.x+player.w > en.x && player.y < en.y+en.h && player.y+player.h > en.y){
          en.dead = true;
          lives--; livesEl.textContent = lives;
          if (lives <= 0) endGame();
        }
      }
      enemies = enemies.filter(e=>!e.dead);

      stars.forEach(s=>{ s.y += s.s; if (s.y>H) s.y=0; });
    }
    draw();
    raf = requestAnimationFrame(update);
  }

  function draw(){
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    stars.forEach(s=> ctx.fillRect(s.x, s.y, s.s, s.s));

    // player ship (triangle)
    ctx.fillStyle = '#00e5a0';
    ctx.beginPath();
    ctx.moveTo(player.x+player.w/2, player.y);
    ctx.lineTo(player.x, player.y+player.h);
    ctx.lineTo(player.x+player.w, player.y+player.h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffe23b';
    bullets.forEach(b=> ctx.fillRect(b.x, b.y, b.w, b.h));

    ctx.fillStyle = '#ff3b6b';
    enemies.forEach(en=>{
      ctx.beginPath();
      ctx.moveTo(en.x+en.w/2, en.y+en.h);
      ctx.lineTo(en.x, en.y);
      ctx.lineTo(en.x+en.w, en.y);
      ctx.closePath();
      ctx.fill();
    });
  }

  document.getElementById('restartBtn').addEventListener('click', reset);
  reset();
  update();
})();
</script>
</body>
</html>
