<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pong — WebFliperama</title>
<style>
  :root{ --bg:#0b0f1a; --panel:#121a2b; --accent:#00e5a0; --accent2:#ff3b6b; --text:#e8eefc; --muted:#7c8aa8; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;}
  h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 12px rgba(0,229,160,.5);}
  .hud{display:flex;gap:40px;font-size:22px;font-weight:700;}
  .hud .p1{color:var(--accent);} .hud .p2{color:var(--accent2);}
  canvas{background:var(--panel);border:2px solid #182240;border-radius:10px;}
  .tip{color:var(--muted);font-size:12px;text-align:center;}
  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;}
  .overlay.show{display:flex;}
  .overlay h2{color:var(--accent2);font-size:28px;margin:0;}
  button{background:var(--accent);color:#04140f;border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>PONG</h1>
  <div class="hud"><span class="p1" id="s1">0</span><span>×</span><span class="p2" id="s2">0</span></div>
  <canvas id="game" width="600" height="400"></canvas>
  <div class="tip">Jogador 1: W / S &nbsp;·&nbsp; Jogador 2: ↑ / ↓ &nbsp;·&nbsp; Primeiro a 5 pontos vence</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Fim de jogo</h2>
  <div id="overlayScore"></div>
  <button id="restartBtn">Jogar novamente</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const s1El = document.getElementById('s1'), s2El = document.getElementById('s2');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');

  const PADDLE_W = 12, PADDLE_H = 80, BALL_R = 7, WIN_SCORE = 5;
  let p1y, p2y, ball, score1, score2, keys, running, raf;

  function reset(full){
    p1y = H/2 - PADDLE_H/2;
    p2y = H/2 - PADDLE_H/2;
    resetBall(Math.random()<0.5?-1:1);
    if (full){ score1=0; score2=0; s1El.textContent=0; s2El.textContent=0; }
    running = true;
    keys = {};
    overlay.classList.remove('show');
  }

  function resetBall(dirX){
    ball = { x: W/2, y: H/2, vx: 5*dirX, vy: (Math.random()*4-2) };
  }

  function endGame(winner){
    running = false;
    overlayTitle.textContent = winner + ' venceu!';
    overlayScore.textContent = `Placar final: ${score1} × ${score2}`;
    overlay.classList.add('show');
    // Hook de integração: postScore({ game: 'pong', score: Math.max(score1,score2) });
  }

  window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function update(){
    if (running){
      if (keys['w']) p1y -= 6;
      if (keys['s']) p1y += 6;
      if (keys['arrowup']) p2y -= 6;
      if (keys['arrowdown']) p2y += 6;
      p1y = Math.max(0, Math.min(H-PADDLE_H, p1y));
      p2y = Math.max(0, Math.min(H-PADDLE_H, p2y));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - BALL_R < 0 || ball.y + BALL_R > H) ball.vy *= -1;

      // paddle 1
      if (ball.x - BALL_R < 20 + PADDLE_W && ball.y > p1y && ball.y < p1y+PADDLE_H && ball.vx < 0){
        ball.vx *= -1.08;
        ball.vy += (ball.y - (p1y+PADDLE_H/2)) * 0.12;
      }
      // paddle 2
      if (ball.x + BALL_R > W - 20 - PADDLE_W && ball.y > p2y && ball.y < p2y+PADDLE_H && ball.vx > 0){
        ball.vx *= -1.08;
        ball.vy += (ball.y - (p2y+PADDLE_H/2)) * 0.12;
      }

      if (ball.x < 0){ score2++; s2El.textContent=score2; if(score2>=WIN_SCORE){endGame('Jogador 2');} else resetBall(1); }
      if (ball.x > W){ score1++; s1El.textContent=score1; if(score1>=WIN_SCORE){endGame('Jogador 1');} else resetBall(-1); }
    }
    draw();
    raf = requestAnimationFrame(update);
  }

  function draw(){
    ctx.fillStyle = '#121a2b';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.setLineDash([8,10]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#00e5a0';
    ctx.fillRect(20, p1y, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#ff3b6b';
    ctx.fillRect(W-20-PADDLE_W, p2y, PADDLE_W, PADDLE_H);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    ctx.fill();
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>reset(true));
  reset(true);
  update();
})();
</script>
</body>
</html>
