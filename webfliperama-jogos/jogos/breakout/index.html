<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Breakout — WebFliperama</title>
<style>
  :root{ --bg:#0b0f1a; --panel:#121a2b; --accent:#00e5a0; --accent2:#ff3b6b; --text:#e8eefc; --muted:#7c8aa8; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;}
  h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 12px rgba(0,229,160,.5);}
  .hud{display:flex;gap:24px;font-size:14px;color:var(--muted);}
  .hud b{color:var(--text);}
  canvas{background:var(--panel);border:2px solid #182240;border-radius:10px;cursor:none;}
  .tip{color:var(--muted);font-size:12px;}
  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;}
  .overlay.show{display:flex;}
  .overlay h2{color:var(--accent2);font-size:28px;margin:0;}
  button{background:var(--accent);color:#04140f;border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>BREAKOUT</h1>
  <div class="hud"><span>Pontos: <b id="score">0</b></span><span>Vidas: <b id="lives">3</b></span><span>Nível: <b id="level">1</b></span></div>
  <canvas id="game" width="560" height="420"></canvas>
  <div class="tip">Mova o mouse ou use ← → para controlar a raquete · Espaço para lançar a bola</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Fim de jogo</h2>
  <div id="overlayScore"></div>
  <button id="restartBtn">Jogar novamente</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');

  const PADDLE_W = 90, PADDLE_H = 12, BALL_R = 7;
  const ROWS = 5, COLS = 8, BRICK_W = 60, BRICK_H = 20, BRICK_PAD = 6, BRICK_TOP = 50, BRICK_LEFT = 20;
  const colors = ['#ff3b6b','#ff9d3b','#ffe23b','#00e5a0','#3bb0ff'];

  let paddleX, ball, bricks, score, lives, level, running, launched, raf, keys={};

  function initBricks(){
    bricks = [];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        bricks.push({x: BRICK_LEFT + c*(BRICK_W+BRICK_PAD), y: BRICK_TOP + r*(BRICK_H+BRICK_PAD), alive:true, color: colors[r%colors.length]});
      }
    }
  }

  function resetBall(){
    launched = false;
    ball = { x: paddleX + PADDLE_W/2, y: H-40-BALL_R, vx: 4, vy: -4, speed: 5 };
  }

  function reset(full){
    paddleX = W/2 - PADDLE_W/2;
    if (full){ score=0; lives=3; level=1; scoreEl.textContent=0; livesEl.textContent=3; levelEl.textContent=1; initBricks(); }
    resetBall();
    running = true;
    overlay.classList.remove('show');
  }

  function endGame(win){
    running = false;
    overlayTitle.textContent = win ? 'Você venceu!' : 'Fim de jogo';
    overlayScore.textContent = 'Pontuação: ' + score;
    overlay.classList.add('show');
    // Hook de integração: postScore({ game: 'breakout', score });
  }

  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' '){ if (!launched && running) launched = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('mousemove', e=>{
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, x - PADDLE_W/2));
  });
  canvas.addEventListener('click', ()=>{ if (!launched && running) launched = true; });

  function update(){
    if (running){
      if (keys['arrowleft']) paddleX -= 7;
      if (keys['arrowright']) paddleX += 7;
      paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

      if (!launched){
        ball.x = paddleX + PADDLE_W/2;
      } else {
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - BALL_R < 0){ ball.x = BALL_R; ball.vx *= -1; }
        if (ball.x + BALL_R > W){ ball.x = W-BALL_R; ball.vx *= -1; }
        if (ball.y - BALL_R < 0){ ball.y = BALL_R; ball.vy *= -1; }

        if (ball.y + BALL_R > H){
          lives--; livesEl.textContent = lives;
          if (lives <= 0){ endGame(false); } else { resetBall(); }
        }

        // paddle collision
        if (ball.vy > 0 && ball.y + BALL_R > H-30 && ball.y + BALL_R < H-30+PADDLE_H+8 &&
            ball.x > paddleX && ball.x < paddleX+PADDLE_W){
          ball.y = H-30-BALL_R;
          const hitPos = (ball.x - (paddleX+PADDLE_W/2)) / (PADDLE_W/2);
          const angle = hitPos * (Math.PI/3);
          ball.vx = ball.speed * Math.sin(angle);
          ball.vy = -Math.abs(ball.speed * Math.cos(angle));
        }

        // bricks collision
        for (const b of bricks){
          if (!b.alive) continue;
          if (ball.x+BALL_R > b.x && ball.x-BALL_R < b.x+BRICK_W && ball.y+BALL_R > b.y && ball.y-BALL_R < b.y+BRICK_H){
            b.alive = false;
            ball.vy *= -1;
            score += 10; scoreEl.textContent = score;
            break;
          }
        }

        if (bricks.every(b=>!b.alive)){
          level++; levelEl.textContent = level;
          ball.speed += 1;
          initBricks();
          resetBall();
        }
      }
    }
    draw();
    raf = requestAnimationFrame(update);
  }

  function draw(){
    ctx.fillStyle = '#121a2b';
    ctx.fillRect(0,0,W,H);

    bricks.forEach(b=>{
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
    });

    ctx.fillStyle = '#00e5a0';
    ctx.fillRect(paddleX, H-30, PADDLE_W, PADDLE_H);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    ctx.fill();

    if (!launched && running){
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Clique ou pressione Espaço para lançar', W/2, H-60);
    }
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>reset(true));
  reset(true);
  update();
})();
</script>
</body>
</html>
