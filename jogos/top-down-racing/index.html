<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Top-Down Racing — WebFliperama</title>
<style>
  :root{ --bg:#0b0f1a; --panel:#1a2e1a; --track:#2b3a4a; --accent:#00e5a0; --accent2:#ff3b6b; --text:#e8eefc; --muted:#7c8aa8; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;}
  h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 12px rgba(0,229,160,.5);}
  .hud{display:flex;gap:24px;font-size:14px;color:var(--muted);}
  .hud b{color:var(--text);}
  canvas{background:#1a2e1a;border:2px solid #182240;border-radius:10px;}
  .tip{color:var(--muted);font-size:12px;}
  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;}
  .overlay.show{display:flex;}
  .overlay h2{color:var(--accent2);font-size:28px;margin:0;}
  button{background:var(--accent);color:#04140f;border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>TOP-DOWN RACING</h1>
  <div class="hud"><span>Volta: <b id="lap">0</b>/3</span><span>Tempo: <b id="time">0.0</b>s</span><span>Melhor: <b id="best">—</b>s</span></div>
  <canvas id="game" width="560" height="480"></canvas>
  <div class="tip">↑/W acelera · ↓/S freia/ré · ←→ / A D vira · Fique na pista, saia dela para desacelerar</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Corrida concluída!</h2>
  <div id="overlayScore"></div>
  <button id="restartBtn">Jogar novamente</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const lapEl = document.getElementById('lap');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayScore = document.getElementById('overlayScore');

  const BEST_KEY = 'webfliperama_racing_best';
  let best = localStorage.getItem(BEST_KEY);
  bestEl.textContent = best ? parseFloat(best).toFixed(1) : '—';

  // Oval track defined as outer/inner radius from center
  const cx = W/2, cy = H/2, outerRx = 250, outerRy = 190, innerRx = 130, innerRy = 90;

  function onTrack(x,y){
    const dx = x-cx, dy = y-cy;
    const outer = (dx*dx)/(outerRx*outerRx) + (dy*dy)/(outerRy*outerRy);
    const inner = (dx*dx)/(innerRx*innerRx) + (dy*dy)/(innerRy*innerRy);
    return outer <= 1 && inner >= 1;
  }

  let car, keys={}, lap, lastAngleSide, time, running, raf, finished;

  function reset(){
    car = { x: cx, y: cy-outerRy+30, angle: -Math.PI/2, speed: 0 };
    lap = 0; time = 0; running = true; finished = false;
    lastAngleSide = null;
    lapEl.textContent = 0; timeEl.textContent = '0.0';
    overlay.classList.remove('show');
  }

  function endRace(){
    running = false; finished = true;
    const t = time;
    if (!best || t < parseFloat(best)){ best = t; localStorage.setItem(BEST_KEY, t); bestEl.textContent = t.toFixed(1); }
    document.getElementById('overlayTitle') && (document.getElementById('overlayTitle').textContent = 'Corrida concluída!');
    overlayScore.textContent = 'Tempo total: ' + t.toFixed(1) + 's';
    overlay.classList.add('show');
    // Hook de integração: postScore({ game: 'top-down-racing', score: Math.max(0, Math.round(10000/t)) });
  }

  window.addEventListener('keydown', e=> keys[e.key.toLowerCase()]=true);
  window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

  function update(dt){
    if (!running) return;
    time += dt;
    timeEl.textContent = time.toFixed(1);

    const accel = (keys['arrowup']||keys['w']) ? 0.25 : (keys['arrowdown']||keys['s']) ? -0.25 : 0;
    car.speed += accel;
    car.speed *= onTrack(car.x,car.y) ? 0.985 : 0.90; // friction; off-track slows a lot
    car.speed = Math.max(-3, Math.min(6, car.speed));

    const turnSpeed = 0.045 * (Math.min(Math.abs(car.speed),4)/4 + 0.3);
    if (keys['arrowleft']||keys['a']) car.angle -= turnSpeed;
    if (keys['arrowright']||keys['d']) car.angle += turnSpeed;

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    // lap detection: crossing the top of the track (finish line) moving with positive progress
    const dx = car.x-cx, dy = car.y-cy;
    const angleFromCenter = Math.atan2(dy,dx); // -PI..PI, top is -PI/2
    const side = angleFromCenter > -Math.PI/2 ? 1 : -1;
    const nearFinish = Math.abs(dx) < 40 && dy < -outerRy+70 && dy > -outerRy-10;
    if (nearFinish && lastAngleSide === -1 && side === 1){
      lap++;
      lapEl.textContent = lap;
      if (lap >= 3) endRace();
    }
    if (nearFinish) lastAngleSide = side;
  }

  function draw(){
    ctx.fillStyle = '#1a2e1a';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#3a4a2a';
    ctx.beginPath(); ctx.ellipse(cx,cy,outerRx,outerRy,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b3a4a';
    ctx.beginPath(); ctx.ellipse(cx,cy,outerRx,outerRy,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a2e1a';
    ctx.beginPath(); ctx.ellipse(cx,cy,innerRx,innerRy,0,0,Math.PI*2); ctx.fill();

    // finish line
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-20, cy-outerRy+8, 40, 10);

    // car
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.fillStyle = onTrack(car.x,car.y) ? '#00e5a0' : '#ff9d3b';
    ctx.fillRect(-10, -6, 20, 12);
    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  document.getElementById('restartBtn').addEventListener('click', reset);
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
