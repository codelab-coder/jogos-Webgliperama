<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Snake — WebFliperama</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#121a2b; --accent:#00e5a0; --accent2:#ff3b6b;
    --text:#e8eefc; --muted:#7c8aa8; --grid:#182240;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;}
  h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 12px rgba(0,229,160,.5);}
  .hud{display:flex;gap:24px;font-size:14px;color:var(--muted);}
  .hud b{color:var(--text);}
  canvas{background:var(--panel);border:2px solid var(--grid);border-radius:10px;box-shadow:0 0 30px rgba(0,229,160,.08);}
  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;}
  .overlay.show{display:flex;}
  .overlay h2{color:var(--accent2);font-size:28px;margin:0;}
  button{background:var(--accent);color:#04140f;border:none;padding:10px 22px;border-radius:8px;
    font-weight:700;cursor:pointer;font-size:15px;}
  button:hover{filter:brightness(1.1);}
  .tip{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>SNAKE</h1>
  <div class="hud"><span>Pontos: <b id="score">0</b></span><span>Recorde: <b id="best">0</b></span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="tip">Setas / WASD para mover · Espaço para pausar</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Fim de jogo</h2>
  <div id="overlayScore"></div>
  <button id="restartBtn">Jogar novamente</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const SIZE = 20, COLS = canvas.width/SIZE, ROWS = canvas.height/SIZE;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');

  const BEST_KEY = 'webfliperama_snake_best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, running, paused, speed, timer;

  function reset(){
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; speed = 120; paused = false; running = true;
    scoreEl.textContent = 0;
    placeFood();
    overlay.classList.remove('show');
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function placeFood(){
    let ok=false;
    while(!ok){
      food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function endGame(){
    running = false;
    clearInterval(timer);
    if (score > best){ best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
    overlayTitle.textContent = 'Fim de jogo';
    overlayScore.textContent = 'Pontuação: ' + score;
    overlay.classList.add('show');
    // Hook de integração: enviar pontuação para o backend do WebFliperama
    // Exemplo: postScore({ game: 'snake', score });
  }

  function tick(){
    if (!running || paused) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x<0 || head.y<0 || head.x>=COLS || head.y>=ROWS || snake.some(s=>s.x===head.x&&s.y===head.y)){
      endGame(); draw(); return;
    }

    snake.unshift(head);
    if (head.x===food.x && head.y===food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60){ speed -= 3; clearInterval(timer); timer = setInterval(tick, speed); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw(){
    ctx.fillStyle = '#121a2b';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for(let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*SIZE,0); ctx.lineTo(i*SIZE,canvas.height); ctx.stroke(); }
    for(let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*SIZE); ctx.lineTo(canvas.width,j*SIZE); ctx.stroke(); }

    ctx.fillStyle = '#ff3b6b';
    ctx.beginPath();
    ctx.arc(food.x*SIZE+SIZE/2, food.y*SIZE+SIZE/2, SIZE/2-3, 0, Math.PI*2);
    ctx.fill();

    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#00e5a0' : '#02b184';
      ctx.fillRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
    });

    if (paused && running){
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSADO', canvas.width/2, canvas.height/2);
    }
  }

  window.addEventListener('keydown', (e)=>{
    const k = e.key.toLowerCase();
    if (k===' '){ if(running){ paused = !paused; draw(); } e.preventDefault(); return; }
    const map = {
      'arrowup':{x:0,y:-1}, 'w':{x:0,y:-1},
      'arrowdown':{x:0,y:1}, 's':{x:0,y:1},
      'arrowleft':{x:-1,y:0}, 'a':{x:-1,y:0},
      'arrowright':{x:1,y:0}, 'd':{x:1,y:0},
    };
    const nd = map[k];
    if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
  });

  document.getElementById('restartBtn').addEventListener('click', reset);

  reset();
  draw();
})();
</script>
</body>
</html>
